# The default rules, minus one match: the analytics library that the settings
# page script bundled until 1.1.9 names its anonymous-id cookie "ajs_anonymous_id"
# in a variable called anonKey, which the generic key rule reads as a secret. The
# scan reads the whole history, where that script remains.
[extend]
useDefault = true

[[allowlists]]
description = "Cookie name of the bundled analytics library"
regexTarget = "line"
regexes = ['''anonKey="ajs_anonymous_id"''']

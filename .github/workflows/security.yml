name: Security

# Static security analysis of the module code, and secrets over the whole history.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # PHP has no CodeQL support: Semgrep with its PHP rules over the module code,
    # and Gitleaks over every commit for a key or a token committed by mistake.
    name: Security
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: '1.182.1'
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer
      - name: composer.json is valid
        run: composer validate --no-check-publish --no-check-lock
      - name: Semgrep
        run: |
          pip install --quiet "semgrep==$SEMGREP_VERSION"
          semgrep scan --metrics=off --error --config p/php ps_edition_basic.php src upgrade config
      - name: Gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

name: UI tests

# A real browser through the back office of the official PrestaShop images, with
# the module installed as a shop gets it from Build for Testing: the oldest
# PrestaShop 8, where the module brings the PrestaShop 9 look, and PrestaShop 9,
# where it only brings the simplified menu and the settings page.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: UI sanity (PS ${{ matrix.prestashop }}, PHP ${{ matrix.php }}, ${{ matrix.browser }}, ${{ matrix.db }})
    # Pinned: on newer runner images apt and the shop install fail to resolve the
    # archive and package hosts, for a reason unrelated to the module.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { prestashop: '8.0.0', php: '8.1', major: '8', browser: chromium, db: mysql, db_image: 'mysql:8.0' }
          - { prestashop: '8.2', php: '8.1', major: '8', browser: firefox, db: mariadb, db_image: 'mariadb:11.4' }
          - { prestashop: '9.0', php: '8.1', major: '9', browser: chromium, db: mysql, db_image: 'mysql:8.0' }
          - { prestashop: '9.2.1', php: '8.5', major: '9', browser: chromium, db: mariadb, db_image: 'mariadb:11.4' }
    env:
      ADMIN_MAIL: demo@example.com
      ADMIN_PASSWD: Basic-ui-test-1
    steps:
      - uses: actions/checkout@v4
        with:
          path: module
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      # The database and the shop share a network of their own, so the shop finds
      # its database by name, as it would on a host.
      - name: Start the database and PrestaShop ${{ matrix.prestashop }}
        run: |
          docker network create shopnet
          docker run -d --name db --network shopnet \
            -e MYSQL_ROOT_PASSWORD=root -e MARIADB_ROOT_PASSWORD=root -e MYSQL_DATABASE=prestashop \
            "${{ matrix.db_image }}"
          docker run -d --name shop --network shopnet -p 8080:80 \
            -e DB_SERVER=db -e DB_USER=root -e DB_PASSWD=root -e DB_NAME=prestashop \
            -e PS_INSTALL_AUTO=0 \
            "prestashop/prestashop:${{ matrix.prestashop }}-${{ matrix.php }}"

      # Installed here rather than by the image: on PrestaShop 9 the installer
      # removes its own folder, then the image's start script fails removing it
      # again and stops the container. The database is waited for through PDO: the
      # PHP 8.5 images have no mysqli. The admin folder is copied into the
      # container's own layer first, because Docker's overlay filesystem refuses
      # to rename a folder of the image on some runners.
      - name: Install PrestaShop ${{ matrix.prestashop }}
        run: |
          for _ in $(seq 1 60); do
            docker exec shop test -f /var/www/html/install/index_cli.php \
              && docker exec shop php -r 'try { new PDO("mysql:host=db;dbname=prestashop", "root", "root"); exit(0); } catch (Throwable $e) { exit(1); }' && break
            sleep 5
          done
          docker exec shop sh -c 'cd /var/www/html && if [ -d admin ]; then cp -a admin admin.copy && rm -rf admin && mv admin.copy admin; fi'
          set -o pipefail
          docker exec -u www-data -w /var/www/html shop php -d memory_limit=-1 install/index_cli.php \
            --domain=localhost:8080 --db_server=db --db_name=prestashop --db_user=root --db_password=root \
            --prefix=ps_ --firstname=Demo --lastname=Shop --email="$ADMIN_MAIL" --password="$ADMIN_PASSWD" \
            --language=en --country=fr --newsletter=0 --send_email=0 --ssl=0 2>&1 | tee install.log \
            || { echo "::error title=Shop not installed::$(tail -n 40 install.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Wait for the shop
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error title=Shop not answering::the front office answered $code"
          exit 1

      # The back office refuses to sign anyone in while the install folder is
      # there. A back office still named admin is renamed by PrestaShop 8 on the
      # first visit, which fails on some runners: mv falls back to a copy.
      - name: Remove the install folder and find the back office
        run: |
          docker exec shop sh -c 'rm -rf /var/www/html/install /var/www/html/install-dev'
          ADMIN_DIR=$(docker exec shop sh -c 'for d in /var/www/html/admin*/; do [ "$(basename "$d")" != admin-api ] && [ -f "$d/index.php" ] && basename "$d" && break; done')
          [ -n "$ADMIN_DIR" ] || { echo "::error title=No back office::no admin folder found in the image"; exit 1; }
          if [ "$ADMIN_DIR" = admin ]; then
            docker exec shop mv /var/www/html/admin /var/www/html/admin-ui-test
            ADMIN_DIR=admin-ui-test
          fi
          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Install the module
        run: |
          # The same folder Build for Testing zips, for this PrestaShop version.
          module/dev/package/build.sh "$RUNNER_TEMP/pack" "${{ matrix.major }}"
          docker cp "$RUNNER_TEMP/pack/ps_edition_basic" shop:/var/www/html/modules/ps_edition_basic
          docker exec shop chown -R www-data:www-data /var/www/html/modules/ps_edition_basic
          set -o pipefail
          docker exec -u www-data -w /var/www/html shop php bin/console prestashop:module install ps_edition_basic 2>&1 | tee module.log \
            || { echo "::error title=Module install failed::$(tail -n 40 module.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          grep -qiE 'succe' module.log || { echo "::error title=Module install failed::$(tail -n 40 module.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      # The module catalogue shops run on PrestaShop 8.0.2 and up: its window of
      # recommended modules is one of the screens other modules draw in the back
      # office, and has to hold up under the PrestaShop 9 look. Checkout also
      # asks for it: without it, its page stops at a screen asking to authorize
      # its installation, and its own page is never drawn. The catalogue does
      # not install on 8.0.0, where Checkout shows that screen only.
      - name: PrestaShop's module catalogue
        if: matrix.prestashop == '8.2'
        run: |
          git clone --quiet --depth 1 --branch v4.14.3 https://github.com/PrestaShopCorp/ps_mbo.git "$RUNNER_TEMP/ps_mbo"
          composer install --working-dir="$RUNNER_TEMP/ps_mbo" --no-dev --no-interaction --no-progress --ignore-platform-reqs
          docker cp "$RUNNER_TEMP/ps_mbo" shop:/var/www/html/modules/ps_mbo
          docker exec shop chown -R www-data:www-data /var/www/html/modules/ps_mbo
          docker exec -u www-data -w /var/www/html shop php bin/console prestashop:module install ps_mbo

      # PrestaShop Checkout draws its configuration page outside PrestaShop's
      # bootstrap frame, with an app of its own: the page every shop with
      # Checkout opens, and the one the PrestaShop 9 look has to hold up on.
      # Release builds, which carry their dependencies; its app needs
      # PrestaShop Account and the module catalogue installed to show.
      - name: PrestaShop Checkout
        if: matrix.major == '8'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ps_accounts.zip" https://github.com/PrestaShopCorp/ps_accounts/releases/download/v8.0.17/ps_accounts-8.0.17.zip
          curl -fsSL -o "$RUNNER_TEMP/ps_checkout.zip" https://github.com/PrestaShopCorp/ps_checkout/releases/download/v5.5.6/ps_checkout-v8.5.5.6.zip
          for name in ps_accounts ps_checkout; do
            rm -rf "${RUNNER_TEMP:?}/$name" && mkdir -p "$RUNNER_TEMP/$name"
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
            docker cp "$RUNNER_TEMP/$name/$name" shop:/var/www/html/modules/$name
            docker exec shop chown -R www-data:www-data /var/www/html/modules/$name
            docker exec -u www-data -w /var/www/html shop php -d memory_limit=-1 bin/console prestashop:module install $name
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright and ${{ matrix.browser }}
        working-directory: module/dev/ui-tests
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Sanity run
        working-directory: module/dev/ui-tests
        env:
          # The views go to the log on a manual run only: they make it long.
          PRINT_VIEWS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          node sanity.mjs "http://localhost:8080/$ADMIN_DIR/" "$ADMIN_MAIL" "$ADMIN_PASSWD" ${{ matrix.browser }} \
            "$GITHUB_WORKSPACE/ui-shots" ${{ matrix.major }} "$GITHUB_WORKSPACE/ui-results.txt"

      # What the back office looks like with the module, failed or not.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-views-${{ matrix.prestashop }}-${{ matrix.browser }}-${{ matrix.db }}
          path: ui-shots/view-*.jpg
          if-no-files-found: ignore

      - name: Shop log
        if: failure()
        run: |
          docker logs shop 2>&1 | tail -n 200
          docker exec shop sh -c 'tail -n 100 /var/www/html/var/logs/*.log 2>/dev/null' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-shots-${{ matrix.prestashop }}-${{ matrix.browser }}-${{ matrix.db }}
          path: |
            ui-shots
            ui-results.txt
          if-no-files-found: ignore

  passed:
    # One name to require, whatever the matrix becomes.
    name: UI passed
    needs: sanity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every pair green
        run: |
          echo "sanity jobs: ${{ needs.sanity.result }}"
          [ "${{ needs.sanity.result }}" = success ]
